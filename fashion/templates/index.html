{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vogue Vista Loader</title>
    <style>
        /* 1. RESET & BASE STYLES */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 2. LOADER CONTAINER */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* 3. THE 3D LOGO ANIMATION */
        .logo-container {
            perspective: 1000px; 
        }

        .vv-logo {
            width: 250px; /* Adjust based on your image size */
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* The Rotation Animation */
            animation: rotateLogo 3s infinite linear;
            transform-style: preserve-3d;
        }

        .vv-logo img {
            width: 100%;
            height: auto;
            /* Optional: adds a slight golden glow to the image */
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        @keyframes rotateLogo {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
    </style>
</head>
<body>

    <div id="loader-wrapper">
        <div class="logo-container">
            <div class="vv-logo">
                <img src="{% static 'vv.png' %}" alt="Vogue Vista Logo">
            </div>
        </div>
    </div>

    <script>
        // Once the page/assets are loaded, wait for the animation 
        // and then redirect to the main page.
        window.addEventListener("load", function() {
            
            // Setting a 3-second delay (3000ms) to allow the spin to be seen
            setTimeout(() => {
                window.location.href = "{% url 'main' %}";
            }, 3000); 
            
        });
    </script>

</body>
</html>
